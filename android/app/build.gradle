plugins {
    id 'com.android.application'
}

def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'uz.tajvid.quron'
    compileSdk 35
    buildToolsVersion '35.0.0'

    defaultConfig {
        applicationId 'uz.tajvid.quron'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '2.0'
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// put the signed APK next to the project, where it is easy to find
tasks.matching { it.name == 'assembleRelease' }.configureEach {
    doLast {
        copy {
            from layout.buildDirectory.file('outputs/apk/release/app-release.apk')
            into rootProject.file('..')
            rename { 'Muallim-Quron.apk' }
        }
    }
}
